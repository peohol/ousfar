# Hver PR skal ha ett prosjekt og én ansvarlig systemarkitekt, og de samme skal
# stå på Issue-et med arbeidsoppgaven (docs/prosjektansvar.md). Kontrollen
# henter PR-en og Issue-et fra GitHub med lesetilgang, har ingen hemmeligheter
# og kan ikke skrive noe. Den er påkrevd før sammenslåing gjennom regelsettet
# «Prosjektansvar» på main. Endres Issue-et, starter prosjektansvar-sak.yml den
# på nytt.
name: Prosjektansvar

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled, assigned, unassigned]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: prosjektansvar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  etikett:
    name: Prosjektansvar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/prosjektansvar.mjs
            .github/prosjektansvar.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Ett prosjekt og én ansvarlig, som på Issue-et
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prosjektansvar.mjs
