# Den påkrevde kontrollen «Prosjektansvar» (docs/prosjektansvar.md §6): hver PR
# har ett prosjekt og én ansvarlig systemarkitekt, og de samme står på Issue-et
# med arbeidsoppgaven.
#
# Betrodd: hendelsene workflow_run og issues kjører alltid denne fila og
# skriptet slik de er på main, og jobben sjekker bare ut main. PR-en og
# Issue-ene leses som data fra GitHub; ingen kode fra PR-en kjøres. Resultatet
# skrives som check run-en «Prosjektansvar» på PR-ens siste commit, og det er
# den regelsettet «Prosjektansvar» på main krever før sammenslåing.
#
# - workflow_run: «Prosjektansvar – utløser» er ferdig etter en endring av en PR.
# - issues: et Issue har fått ny ansvarlig eller etikett, eller er slettet eller
#   flyttet; alle åpne PR-er som viser til det, vurderes på nytt.
name: Prosjektansvar

on:
  workflow_run:
    workflows: ['Prosjektansvar – utløser']
    types: [completed]
  issues:
    types: [assigned, unassigned, labeled, unlabeled, deleted, transferred, reopened]

permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: prosjektansvar-${{ github.event.workflow_run.head_sha || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  vurder:
    name: Vurder prosjektansvar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/prosjektansvar.mjs
            .github/prosjektansvar.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Vurder PR-ene og skriv «Prosjektansvar» på dem
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prosjektansvar.mjs
