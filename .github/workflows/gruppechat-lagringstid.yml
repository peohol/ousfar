# Lagringstiden for chatten (12 måneder: gruppechatten, Peder 17.11.2026,
# docs/gruppechat.md, «Lagringstiden»; direktemeldingene, beslutning 2
# 18.11.2026, docs/direktemeldinger-personvern.md): sletter hver natt
# meldingene eldre enn lagringstiden i alle grupper og direktesamtaler, også
# dem ingen åpner, og kontrollerer at ingen står igjen. Funksjonene leser aldri
# ut en utgått melding uansett; jobben sørger for at raden faktisk blir borte.
#
# Per chat én skrivende spørring (`intern.rydd_gruppechat()`,
# `intern.rydd_direktemeldinger()`) og én skrivebeskyttet kontroll. Ingen
# tekst, avsendere, grupper eller samtaler leses ut, ingen push og ingen
# artefakter. En rød kjøring betyr at ryddingen ikke gikk; GitHub varsler da
# eieren av repoet, og neste natt prøver den igjen.
name: Gruppechat – lagringstid

on:
  schedule:
    # 02:07 UTC hver natt, utenom de andre nattlige jobbene.
    - cron: '7 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: gruppechat-lagringstid
  cancel-in-progress: false

jobs:
  rydd:
    name: Slett utgåtte chatmeldinger
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SUPABASE_ACCESS_TOKEN ligger i miljøet, som bare main får bruke.
    environment: produksjon
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Uten installasjonsskript, og før hemmeligheten er i miljøet.
      - run: npm ci --ignore-scripts

      - name: Slett og kontroller
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run -s gruppechat:lagringstid
