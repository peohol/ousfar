# Skånsom måling av produksjonsdatabasen hver tredje time (docs/db-maling.md):
# svartid, feilrate, swap, disk-I/O og midlertidige filer, så effekten av mindre
# QA-trafikk, SQL-endringer og en eventuell oppgradering kan skilles.
#
# Målingen bare leser: maskinens metrikker, statistikkvisningene og loggene.
# Den kaller ikke appen og endrer ingenting i databasen. Historikken (én
# måling per linje) ligger på grenen `drift-malinger`, ikke på main, så
# målingene utløser verken CI eller utrulling. Rapporten står i sammendraget.
name: Databasemåling

on:
  schedule:
    - cron: '50 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: db-maling
  cancel-in-progress: false

env:
  GREN: drift-malinger
  FIL: db-malinger.jsonl

jobs:
  mal:
    name: Mål databasen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SUPABASE_ACCESS_TOKEN ligger i miljøet, som bare main får bruke.
    environment: produksjon
    permissions:
      # Bare for å legge målingen til historikkgrenen.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Uten installasjonsskript, og før hemmeligheten er i miljøet.
      - run: npm ci --ignore-scripts

      - name: Hent historikken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          adresse="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$adresse" "$GREN" > /dev/null; then
            git clone --quiet --depth 1 --branch "$GREN" "$adresse" malinger
          else
            # Første kjøring: en egen gren uten appens historikk.
            git init --quiet --initial-branch "$GREN" malinger
            git -C malinger remote add origin "$adresse"
          fi

      - name: Mål
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run -s db:maling -- maling --historikk "malinger/$FIL"

      - name: Skriv rapporten
        run: npm run -s db:maling -- rapport --historikk "malinger/$FIL" >> "$GITHUB_STEP_SUMMARY"

      - name: Lagre historikken
        run: |
          set -euo pipefail
          cd malinger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FIL"
          git commit --quiet -m "Databasemåling $(date -u +%FT%RZ)"
          git push --quiet origin "HEAD:$GREN"
