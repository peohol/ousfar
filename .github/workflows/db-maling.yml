# Skånsom måling av produksjonsdatabasen hver tredje time (docs/db-maling.md):
# svartid, feilrate, swap, disk-I/O og midlertidige filer, så effekten av mindre
# QA-trafikk, SQL-endringer og en eventuell oppgradering kan skilles.
#
# Målingen bare leser: maskinens metrikker, statistikkvisningene og loggene.
# Den kaller ikke appen og endrer ingenting i databasen. Historikken (én
# måling per linje) lagres som et artefakt i kjøringen, ikke i Git: ingen push,
# så målingene utløser verken CI eller noen utrulling i Vercel. Hver kjøring
# henter artefaktet fra forrige vellykkede kjøring, legger målingen til og
# lagrer hele historikken på nytt. Rapporten står i sammendraget.
name: Databasemåling

on:
  schedule:
    - cron: '50 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: db-maling
  cancel-in-progress: false

env:
  ARTEFAKT: db-malinger
  FIL: db-malinger.jsonl

jobs:
  mal:
    name: Mål databasen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SUPABASE_ACCESS_TOKEN ligger i miljøet, som bare main får bruke.
    environment: produksjon
    permissions:
      contents: read
      # Bare for å hente historikken fra forrige kjøring.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Uten installasjonsskript, og før hemmeligheten er i miljøet.
      - run: npm ci --ignore-scripts

      - name: Hent historikken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p malinger
          forrige=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow db-maling.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$forrige" ]; then
            gh run download "$forrige" --repo "$GITHUB_REPOSITORY" --name "$ARTEFAKT" --dir malinger \
              || echo "Fant ingen historikk i kjøring $forrige; begynner på nytt."
          else
            echo 'Ingen vellykket kjøring før denne; begynner på nytt.'
          fi

      - name: Mål
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run -s db:maling -- maling --historikk "malinger/$FIL"

      - name: Skriv rapporten
        run: npm run -s db:maling -- rapport --historikk "malinger/$FIL" >> "$GITHUB_STEP_SUMMARY"

      - name: Lagre historikken
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTEFAKT }}
          path: malinger/${{ env.FIL }}
          if-no-files-found: error
          retention-days: 90
