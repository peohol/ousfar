# Rydder kuratorjobbgrenene (docs/kuratorjobber.md, «Automatisk opprydding av
# jobbgrener»). Reglene står i src/kuratorjobb/rydding.ts, med tester.
#
# Fasiten for om kurateringen av et stoff pågår eller er ferdig, er
# kurateringsgrenene i OUSFAR, som leses med arbeidsflytens OIDC-token uten noen
# hemmelighet. Kurateringskøen brukes bare til å beholde jobbgrener den har
# koblet til en oppgave. Kan ikke en av dem leses, slettes ingenting, og
# kjøringen feiler synlig. Bare grener under kuratorjobb/ kan slettes.
name: Rydd ferdige kuratorjobbgrener

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rydd-kuratorjobbgrener.yml
      - src/kuratorjobb/rydding.ts
      - src/kuratorjobb/ryddekjoring.ts
      - src/github/rest.ts
      - src/github/gitslett.ts
  # Hver time, så en gren står høyst en time etter at fristen er gått.
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      kun_vis:
        description: 'Vis hva som ville blitt slettet, uten å slette'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: rydd-kuratorjobbgrener
  cancel-in-progress: false

jobs:
  rydd:
    name: Rydd ferdige, ubrukte jobbgrener
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # For å lese og slette jobbgrenene.
      contents: write
      # For å beholde grener en åpen PR kommer fra.
      pull-requests: read
      # For OIDC-tokenet kurateringsgrenene i OUSFAR leses med (`/api/kuratering-ko`).
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Kurateringsgrenene, uten fagtekst; serveren slipper bare inn denne arbeidsflyten og køen på main.
      OUSFAR_KO_ADRESSE: https://ousfar.vercel.app/api/kuratering-ko
    defaults:
      run:
        working-directory: kode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: kode
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      # Klonen grenene slettes gjennom, bare når de står på commiten som ble vurdert. Ingenting fra den kjøres.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: git
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false

      - name: Rydd jobbgrenene
        env:
          KUN_VIS: ${{ inputs.kun_vis && '--kun-vis' || '' }}
        run: npm run -s rydd-kuratorjobbgrener -- ../git $KUN_VIS
