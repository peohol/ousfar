# Ruller Edge-funksjonene ut til produksjonen fra main (docs/edge-funksjoner.md).
# Kjører bare på main: aldri på PR-er eller andre grener, og hemmelighetene
# ligger i miljøet «produksjon», som bare main får bruke.
name: Edge-funksjoner

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
      - supabase/config.toml
      # Og selve utrullingen, så en endring i den prøves med en gang.
      - .github/workflows/edge-funksjoner.yml
      - scripts/edgeutrulling.ts
      - scripts/migrasjonsmappe.ts
      - src/drift/edgefunksjoner.ts
  # Når produksjonsmigreringen er ferdig: en funksjon som venter på en ny
  # migrasjon, rulles ut først når databasen har den.
  workflow_run:
    workflows: [Produksjonsmigrering]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      modus:
        description: 'kontroll: bare se hva som ville blitt rullet ut. utrull: rull ut det som avviker.'
        type: choice
        options: [kontroll, utrull]
        default: kontroll
      overskriv:
        description: 'Bare etter at avviket er undersøkt: funksjoner (kommaseparert) der koden i produksjonen ikke finnes i repoet, og som skal overskrives.'
        type: string
        default: ''

permissions:
  contents: read

# Aldri to utrullinger av funksjonene samtidig. En egen gruppe, så en kjøring som
# venter her aldri erstatter en ventende produksjonsmigrering.
concurrency:
  group: supabase-edge
  cancel-in-progress: false

env:
  # Bryteren for automatisk utrulling. «nei»: sammenslåinger til main og
  # produksjonsmigreringene gir bare en kontroll (tørrkjøring), og utrullingen
  # startes for hånd med modus «utrull». «ja»: de ruller ut det som avviker.
  # Slått på 2026-11-13 etter første utrulling for hånd (docs/edge-funksjoner.md).
  AUTOMATISK_UTRULLING: ja
  # Prosjekt-ref-en til OUSFAR i Supabase; den er ikke hemmelig.
  SUPABASE_PROJECT_REF: jfzqowsmjtthpbipnxnf

jobs:
  edge:
    name: Edge-funksjonene
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produksjon
    steps:
      - name: Kontroller at tilgangen er satt opp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Hemmeligheten SUPABASE_ACCESS_TOKEN mangler i miljøet «produksjon» (se docs/migrasjoner.md)."
            exit 1
          fi

      # Hele historikken: kode i produksjonen som finnes i en tidligere versjon
      # i repoet, kan erstattes; annen kode stopper utrullingen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Uten installasjonsskript, og før hemmelighetene er i miljøet.
      - run: npm ci --ignore-scripts

      - name: Velg modus
        id: modus
        env:
          HENDELSE: ${{ github.event_name }}
          VALGT: ${{ inputs.modus }}
        run: |
          if [ "$HENDELSE" = workflow_dispatch ]; then modus="$VALGT"
          elif [ "$AUTOMATISK_UTRULLING" = ja ]; then modus=utrull
          else modus=kontroll; fi
          echo "modus=$modus" >> "$GITHUB_OUTPUT"
          echo "### Modus: $modus" >> "$GITHUB_STEP_SUMMARY"

      - name: Kontroll og plan
        id: kontroll
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EDGE_OVERSKRIV: ${{ inputs.overskriv }}
        run: npm run -s edgeutrulling -- kontroll

      # Ved en sammenslåing venter funksjonene til databasen har migrasjonene
      # (kjøringen etter produksjonsmigreringen tar dem). Startet for hånd
      # stopper utrullingen i stedet, så det synes.
      - name: Rull ut funksjonene
        id: utrull
        if: >-
          steps.modus.outputs.modus == 'utrull' && steps.kontroll.outputs.endres != '0' &&
          (github.event_name == 'workflow_dispatch' || steps.kontroll.outputs.venter == '0')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EDGE_OVERSKRIV: ${{ inputs.overskriv }}
        run: npm run -s edgeutrulling -- utrull

      - name: Etterkontroll
        if: always() && steps.utrull.outcome != 'skipped' && steps.utrull.outcome != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run -s edgeutrulling -- etterkontroll
