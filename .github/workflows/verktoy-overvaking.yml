# Kildeovervåkingen for OUSFAR Verktøy (P12.1 og P12.5, VDR-1,
# docs/verktøy-p12-overvaking.md): kildedokumentene og preparatene i FEST hver
# uke, Psychiatrienet den første kjøringen i måneden (det tar om lag ti
# minutter og belaster kilden), eller når den startes for hånd med valget under.
#
# Overvåkingen leser kildene og endrer, godkjenner eller sperrer ingen regel.
# Rapporten står i sammendraget for kjøringen. Funnene meldes til appen
# (/api/kildeovervaking), med et OIDC-token GitHub utsteder for denne
# arbeidsflyten på main. Der blir hvert funn en kildesak som først undersøkes
# teknisk; den faglige redaktøren får bare konkrete faglige spørsmål, og
# prioriteten følger klinisk risiko, ikke tid.
#
# Oppgaven «agent» er agentens arbeid med én sak (Claude, eller noen andre med
# tilgang til repoet): teknisk konklusjon med bevis, faglig spørsmål til
# redaktøren, varsel i verktøyene, tiltak eller avslutning av en prøve. Feltet
# «melding» er JSON-en, for eksempel
#   {"oppgave":"teknisk_konklusjon","funn":12,"versjon":3,"konklusjon":"uavklart","begrunnelse":"…"}
# Hver oppgave tar sakens versjon og avvises når saken er endret siden.
name: Kildeovervåking for Verktøy

on:
  schedule:
    # Mandag 06:20 UTC, etter den nattlige FEST-synkroniseringen.
    - cron: '20 6 * * 1'
  workflow_dispatch:
    inputs:
      oppgave:
        description: kontroll, provesak (bare et syntetisk funn, for å prøve saksgangen i appen) eller agent (arbeid med én sak, se «melding»).
        type: choice
        options: [kontroll, provesak, agent]
        default: kontroll
      psychiatrienet:
        description: Bare for kontroll. Kontroller også Psychiatrienet (om lag ti minutter).
        type: boolean
        default: false
      melding:
        description: Bare for agent. JSON med oppgave (teknisk_konklusjon, faglig_sporsmal, brukervarsel, tiltak, avslutt_prove) og feltene den tar, se src/verktoy/overvaking/agentoppgaver.ts.
        type: string
        default: ''
      av:
        description: Bare for agent. Hvem som har gjort arbeidet.
        type: string
        default: Claude

permissions: {}

env:
  ADRESSE: https://ousfar.vercel.app/api/kildeovervaking

concurrency:
  group: verktoy-overvaking
  cancel-in-progress: false

jobs:
  kontroll:
    name: Kontroller kildegrunnlaget
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.oppgave == 'kontroll' || inputs.oppgave == 'provesak')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Testbrukeren som leser FEST, ligger i miljøet, som bare main får bruke.
    environment: kuratortest
    permissions:
      contents: read
      # Bare for OIDC-tokenet funnene meldes til appen med.
      id-token: write
    env:
      # OUSFARs prosjekt i Supabase og den offentlige nøkkelen, de samme verdiene
      # appen har i nettleseren. Ingen av dem er hemmelige.
      SUPABASE_URL: https://jfzqowsmjtthpbipnxnf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_-xx8oSXHh9dBqs3EnxyprA_vijEb2AU
      OUSFAR_TESTBRUKER: ${{ secrets.OUSFAR_TESTBRUKER }}
      OUSFAR_TESTPASSORD: ${{ secrets.OUSFAR_TESTPASSORD }}
      MED_PSYCHIATRIENET: ${{ inputs.psychiatrienet }}
      OPPGAVE: ${{ inputs.oppgave }}
      HENDELSE: ${{ github.event_name }}
      KJORING: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Kjør overvåkingen
        run: |
          valg=()
          if [ "$OPPGAVE" = "provesak" ]; then
            # Bare det syntetiske funnet: ingen kilde kontrolleres, og ingen reelle funn røres.
            valg=(--provesak --uten-dokumenter --uten-fest)
          elif [ "$MED_PSYCHIATRIENET" = "true" ] || { [ "$HENDELSE" = "schedule" ] && [ "$(date -u +%-d)" -le 7 ]; }; then
            valg=(--psychiatrienet)
          fi
          npm run -s verktoy:overvaking -- kontroll "${valg[@]}" --ut overvaking-resultat
          cat overvaking-resultat/rapport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Meld funnene til appen
        run: |
          set -euo pipefail
          jq -n --slurpfile rapport overvaking-resultat/funn.json --arg lenke "$KJORING" \
            '{oppgave: "registrer", rapport: $rapport[0], lenke: $lenke}' > melding.json
          bash scripts/meld-kildeovervaking.sh melding.json

      - name: Meld deler som ikke ble kontrollert
        run: |
          feil=$(jq '.feil | length' overvaking-resultat/funn.json)
          if [ "$feil" -gt 0 ]; then
            jq -r '.feil[]' overvaking-resultat/funn.json | while read -r linje; do echo "::error::$linje"; done
            exit 1
          fi

  agent:
    name: Agentens arbeid med én sak
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.oppgave == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Bare for OIDC-tokenet; ingen hemmeligheter.
      id-token: write
    env:
      MELDING: ${{ inputs.melding }}
      AV: ${{ inputs.av }}
      AKTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send arbeidet til appen
        run: |
          set -euo pipefail
          # Et JSON-objekt med en agentoppgave; aldri en registrering av en kjøring.
          printf '%s' "$MELDING" | jq -e 'type == "object" and (.oppgave | type == "string") and .oppgave != "registrer"' > /dev/null \
            || { echo "::error::Feltet «melding» må være et JSON-objekt med en agentoppgave."; exit 1; }
          printf '%s' "$MELDING" | jq --arg av "$AV (startet av $AKTOR)" '. + {av: $av}' > melding.json
          bash scripts/meld-kildeovervaking.sh melding.json
