# Nøkkelbyttet for kopilageret (docs/drift-gjenoppretting.md, «Nøkkelen til
# lageret»; src/drift/sikkerhetskopi/nokkelbytte.ts). Nettsiden til Backblaze
# kan ikke lage en nøkkel uten rettighetene kopijobben aldri skal ha, så denne
# jobben lager den. Den bruker hovednøkkelen og skal bare startes etter Peders
# beslutning om det (dokumentet over, «Beslutningen om hovednøkkelen»).
#
# - Nøkkeleieren legger en midlertidig nøkkel som kan lage nøkler
#   (B2_OPPSETT_ID og B2_OPPSETT_NOKKEL) og et GitHub-token som kan skrive
#   hemmelighetene i miljøet (KOPI_GITHUB_TOKEN) i miljøet `backup`, og
#   jobben startes for hånd.
# - Jobben lager en nøkkel som bare gjelder kopibøtta, med nøyaktig
#   rettighetene jobben trenger, kontrollerer den og legger den som ett par i
#   B2_LAGERNOKKEL. Bare når det er sikkert lagret, slettes de gamle nøklene.
# - Ryddesteget kjører også når byttet feiler eller jobben avbrytes, uten
#   checkout: det sletter de tre midlertidige hemmelighetene og trekker
#   tokenet tilbake, og sier i oppsummeringen hva som gjenstår. Hovednøkkelen
#   kan ikke slettes; nøkkeleieren lager en ny etter hver kjøring.
# - Gikk byttet bra, startes kontrollen av lageret.
#
# Bare koden på main kjører med hemmelighetene, og ingen nøkkel skrives ut.
name: Nøkkelbytte for kopilageret

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: sikkerhetskopi
  cancel-in-progress: false

jobs:
  bytte:
    name: Nøkkelbytte
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: backup
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Uten installasjonsskript, og før hemmelighetene er i miljøet.
      - run: npm ci --ignore-scripts

      - name: Byttet
        env:
          B2_OPPSETT_ID: ${{ secrets.B2_OPPSETT_ID }}
          B2_OPPSETT_NOKKEL: ${{ secrets.B2_OPPSETT_NOKKEL }}
          KOPI_GITHUB_TOKEN: ${{ secrets.KOPI_GITHUB_TOKEN }}
          # Den gamle nøkkelen, bare for ID-en, så den kan slettes etter byttet.
          B2_LAGERNOKKEL: ${{ secrets.B2_LAGERNOKKEL }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        run: npm run -s sikkerhetskopi -- nokkelbytte

      # Kontrollen av lageret med den nye nøkkelen (den venter til denne jobben er ferdig).
      - name: Kontrollen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sikkerhetskopi.yml --repo "$GITHUB_REPOSITORY" --ref main -f modus=kontroll

      # Kjører også ved feil og avbrudd, og trenger verken checkout eller npm.
      # Skriver bare faste tekster, navnene og HTTP-statuser.
      - name: Ryddingen
        if: always()
        env:
          KOPI_GITHUB_TOKEN: ${{ secrets.KOPI_GITHUB_TOKEN }}
          MILJO: backup
          MIDLERTIDIGE: B2_OPPSETT_ID B2_OPPSETT_NOKKEL KOPI_GITHUB_TOKEN
        run: |
          api="${GITHUB_API_URL:-https://api.github.com}"
          feil=0
          linje() { echo "$1"; if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then echo "$1" >> "$GITHUB_STEP_SUMMARY"; fi; }
          linje "## Ryddingen etter nøkkelbyttet"
          linje ""
          if [ -z "${KOPI_GITHUB_TOKEN:-}" ]; then
            linje "- KOPI_GITHUB_TOKEN manglet, så de midlertidige hemmelighetene ble ikke slettet her. Slett dem som finnes ($MIDLERTIDIGE) i miljøet $MILJO nå."
            feil=1
          else
            for navn in $MIDLERTIDIGE; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $KOPI_GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$api/repos/$GITHUB_REPOSITORY/environments/$MILJO/secrets/$navn") || status=000
              case "$status" in
                204|404) linje "- $navn er slettet." ;;
                *) linje "- $navn kunne ikke slettes (GitHub svarte $status). Slett den i miljøet $MILJO nå."; feil=1 ;;
              esac
            done
            status=$(printf '{"credentials":["%s"]}' "$KOPI_GITHUB_TOKEN" | curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @- \
              "$api/credentials/revoke") || status=000
            if [ "$status" = 202 ]; then
              linje "- GitHub-tokenet er trukket tilbake."
            else
              linje "- GitHub-tokenet ble ikke trukket tilbake (GitHub svarte $status). Slett det nå under Settings, Developer settings, Personal access tokens."
              feil=1
            fi
          fi
          linje "- Hovednøkkelen i Backblaze trekkes bare tilbake ved at du lager en ny hovednøkkel. Gjør det nå hvis den lå i GitHub."
          exit $feil
